services:
  - type: web
    name: hex-proxy-api
    runtime: python
    repo: https://github.com/yourusername/hex-proxy-api
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0